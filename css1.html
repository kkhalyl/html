<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF=8">
        <title>Instituto ao CSS</title>
    </head>
    <body>
        <style type="text/css">
            p {
                padding: 5%;
                background-color: #c1cdc1;
                border: 10px solid black;
                border-top-left-radius: 15px;
                border-bottom-right-radius: 15px;
                border-top-right-radius: 50px;
                border-bottom-left-radius: 50px;
            }
        </style>
        <p>
            O CSS é uma linguagem de estilo, também conhecida como linguagem
            de folhas de estilo em cascata, usada para personalizar o visual
            de um site ou aplicação.
        </p>
    </body>
</html>
