<!DOCTYPE html>
<html>

<head>
  <style>
    div.blue {
      position: relative;
      width: 100px;
      height: 200px;
      background-color: blue;
    }

    div.yellow {
      position: relative;
      top: -200px;
      left:100px;
      width: 100px;
      height: 150px;
      background-color: yellow;
    }

    div.red {
      position: relative;
      top: -350px;
      left:200px;
      width: 100px;
      height: 150px;
      background-color: red;
    }

    div.green {
      position: relative;
      top:-350px;
      left:100px;
      width: 200px;
      height: 50px;
      background-color: green;
    }
  </style>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Document</title>
</head>

<body>
  <div class="blue"></div>
  <div class="yellow"></div>
  <div class="red"></div>
  <div class="green"></div>
</body>

</html>
