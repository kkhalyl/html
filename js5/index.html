<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Gráfico de barras</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <h1>Um Gráfico de Barras</h1>
  <div>
    Informe a altura das barras:
    <input type="text" size="5" name="Barra1" id="Barra1">
    <input type="text" size="5" name="Barra2" id="Barra2">
    <input type="text" size="5" name="Barra3" id="Barra3">
    <input type="text" size="5" name="Barra4" id="Barra4">
    <input type="text" size="5" name="Barra5" id="Barra5">
  </div>
  <div>
    Informe a largura das barras:
    <input type="text" size="5" name="Largura1" id="Largura1">
  </div>
  <br>
  <input type="button" value="Desenhar o Gráfico" onclick="GerarGrafico()">
  <br>
  <div class="grafico">
    <div id="b1" class="barra"></div>
    <div id="b2" class="barra"></div>
    <div id="b3" class="barra"></div>
    <div id="b4" class="barra"></div>
    <div id="b5" class="barra"></div>
  </div>
  <script src="script.js"></script>
</body>

</html>
