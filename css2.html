<!DOCTYPE html>
<html>

<head>
  <style type="text/css">
    div {
      margin-top: 6%;
      margin-left: 6%;
      color: white;
      text-align: center;
      vertical-align: center; 
      width: 180px;
      height: 350px;
      padding: 20px;
      border: 10px solid #cd950c;
      border-radius: 30px;
      background-color: rgba(0,0,0,0.5);
    }
    p {
      font-weight: bold;
    }
    body{
      background-image: url(nebulosa.png);
      background-repeat: no-repeat;
      background-size:100%;
    }
  </style>
  <meta charset="utf-8">
  <title>Introdução ao CSS</title>
</head>

<body>
  <div>
    <h2>Nebulosa do Anel</h2>
    <p>
      Imagens feitas pelo telescópio James Webb
      ajudaram cientistas a decifrar os mistérios
      por trás da formação da Nebulosa do Anel.
      Graças à riqueza de detalhes fornecidos pelos
      instrumentos de infravermelho do Webb, o passado
      da nebulosa foi rastreado até o momento
      em que ela nasceu.
    </p>
  </div>
</body>

</html>
